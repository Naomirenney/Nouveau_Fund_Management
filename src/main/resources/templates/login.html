<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Login - Apex Trading</title>
</head>
<body>
<main>
    <div class="max-w-md mx-auto mt-16">
        <h1 class="text-3xl font-bold text-center mb-8 text-emerald-400">Login</h1>

        <div th:if="${error}" class="bg-rose-900/40 border border-rose-700 text-rose-300 px-4 py-3 rounded mb-6">
            <span th:text="${error}"></span>
        </div>

        <form method="post" action="/login" class="space-y-6">
            <div>
                <label class="block text-sm mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded transition">
                Login
            </button>
        </form>

        <p class="text-center mt-6">
            No account? <a href="/register" class="text-emerald-400 hover:text-emerald-300">Register</a>
        </p>
    </div>
</main>
</body>
</html>
