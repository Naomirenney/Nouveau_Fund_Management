<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Apex Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen">
<div class="max-w-md mx-auto mt-16 p-6 bg-slate-900 border border-slate-700 rounded-xl">
    <h1 class="text-3xl font-bold text-center mb-8 text-emerald-400">Apex Trading</h1>

    <p class="text-center text-slate-400 mb-6">Enter any username to start trading</p>

    <div th:if="${error}" class="bg-rose-900/40 border border-rose-700 text-rose-300 px-4 py-3 rounded mb-6">
        <span th:text="${error}"></span>
    </div>

    <form method="post" action="/login" class="space-y-6">
        <div>
            <label class="block text-sm mb-1">Username</label>
            <input type="text" name="username" required placeholder="e.g., trader123"
                   class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500 text-white">
        </div>
        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded transition">
            Start Trading
        </button>
    </form>

    <p class="text-center text-slate-500 text-sm mt-6">
        New users get $100,000 in virtual cash!
    </p>
</div>
</body>
</html>
