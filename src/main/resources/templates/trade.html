<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="'Trade ' + ${ticker} + ' - Apex'">Trade</title>
</head>
<body>
<main>
    <div class="flex flex-col md:flex-row gap-8">
        <!-- Left: Chart & Info -->
        <div class="flex-1">
            <h1 class="text-3xl font-bold mb-2" th:text="${security.ticker}"></h1>
            <p class="text-xl mb-6" th:text="${security.companyName}"></p>

            <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 mb-8">
                <div class="text-sm text-slate-400 mb-1">Current Price</div>
                <div class="text-4xl font-bold text-emerald-400" th:text="${#numbers.formatDecimal(security.currentPrice, 0, 2, 'COMMA')}"></div>
                <div class="text-sm text-slate-400 mt-1" th:text="${#temporals.format(security.lastUpdated, 'HH:mm:ss')}"></div>
            </div>

            <canvas id="priceChart" class="w-full h-80"></canvas>
        </div>

        <!-- Right: Trade Form -->
        <div class="w-full md:w-96 bg-slate-900 border border-slate-700 rounded-xl p-8 self-start">
            <h2 class="text-2xl font-bold mb-6">Place Order</h2>

            <form method="post" class="space-y-6">
                <div>
                    <label class="block text-sm mb-2">Quantity</label>
                    <input type="number" name="quantity" min="1" required
                           class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-3 text-lg focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="submit" name="action" value="buy"
                            class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl text-lg transition">
                        BUY
                    </button>
                    <button type="submit" name="action" value="sell"
                            class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-4 px-6 rounded-xl text-lg transition">
                        SELL
                    </button>
                </div>
            </form>

            <p class="text-center text-slate-400 mt-6 text-sm">
                Paper trading — virtual funds only
            </p>
        </div>
    </div>

    <script th:inline="none">
        /* Very simple static chart — in production use real time series */
        const ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['9:30', '10:00', '10:30', '11:00', '11:30', '12:00', 'Now'],
                datasets: [{
                    label: /*[[${ticker}]]*/ 'Price',
                    data: [/* random demo data */ 145, 148, 152, 149, 155, 158, /*[[${security.currentPrice}]]*/ 160],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false, grid: { color: '#334155' } },
                    x: { grid: { color: '#334155' } }
                }
            }
        });
    </script>
</main>
</body>
</html>
