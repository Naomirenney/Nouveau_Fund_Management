<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Apex Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen">
    <div class="max-w-md mx-auto mt-16 p-6 bg-slate-900 border border-slate-700 rounded-xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-emerald-400">Create Account</h1>

        <div th:if="${error}" class="bg-rose-900/40 border border-rose-700 text-rose-300 px-4 py-3 rounded mb-6">
            <span th:text="${error}"></span>
        </div>

        <form method="post" action="/register" class="space-y-6">
            <div>
                <label class="block text-sm mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">Confirm Password</label>
                <input type="password" name="password2" required
                       class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded transition">
                Register
            </button>
        </form>

        <p class="text-center mt-6">
            Already have an account? <a href="/login" class="text-emerald-400 hover:text-emerald-300">Login</a>
        </p>
    </div>
</body>
</html>
